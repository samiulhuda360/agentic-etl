name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint and type-check
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Tests
        run: python -m pytest -q

      - name: Demo (no key; recorded model replies are replayed from cache/)
        run: etl demo

      - name: Replay the evaluation offline and compare with eval/results.json
        run: etl eval --offline --check eval/results.json
